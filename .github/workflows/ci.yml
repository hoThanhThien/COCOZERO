name: COCOZERO CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate curated RAG JSON & run pytest
        run: |
          python -c "from app.services.rag_knowledge import validate_curated_sources; s = validate_curated_sources(); print('Validated RAG sources:', len(s))"
          pytest -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore, build, and test .NET solution
        run: dotnet test CocoCarbon.sln --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install, test, and build Next.js Web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_SHOW_DEMO_MODE: "false"
        run: |
          npm ci
          npm test
          npm run build
