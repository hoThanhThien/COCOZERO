services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cococarbon}
      POSTGRES_USER: ${POSTGRES_USER:-cococarbon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - coco_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cococarbon_app} -d ${POSTGRES_DB:-cococarbon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOTE: PostgreSQL port is NOT exposed publicly in production!

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-CHANGE_ME_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-CHANGE_ME_MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks:
      - coco_internal

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      PROMPT_VERSION: ${PROMPT_VERSION:-coco-auditor-v1.0}
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY:-CHANGE_ME_INTERNAL_SERVICE_SHARED_SECRET}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-25}
      AI_MAX_FILE_BYTES: ${AI_MAX_FILE_BYTES:-15728640}
    networks:
      - coco_internal
    deploy:
      resources:
        limits:
          memory: 1G
    # NOTE: Internal AI service is NOT exposed publicly!

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DB_PROVIDER: postgres
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cococarbon};Username=${POSTGRES_USER:-cococarbon_app};Password=${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_POSTGRES_PASSWORD}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/run/secrets/firebase-service-account.json}
      FIREBASE_AUTH_DEV_ALLOW_MOCK: ${FIREBASE_AUTH_DEV_ALLOW_MOCK:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-CHANGE_ME_64_CHAR_HMAC_SECRET_FOR_PRIVATE_FILE_URLS}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_ROOT: /app/storage
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_INTERNAL_KEY: ${AI_SERVICE_INTERNAL_KEY:-CHANGE_ME_INTERNAL_SERVICE_SHARED_SECRET}
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-35}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - apistorage:/app/storage
    networks:
      - coco_internal
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
        NEXT_PUBLIC_SHOW_DEMO_MODE: ${NEXT_PUBLIC_SHOW_DEMO_MODE:-false}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
      NEXT_PUBLIC_SHOW_DEMO_MODE: ${NEXT_PUBLIC_SHOW_DEMO_MODE:-false}
    networks:
      - coco_internal
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coco_internal

networks:
  coco_internal:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  apistorage:
